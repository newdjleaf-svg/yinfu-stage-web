<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>音芙場控｜網頁版</title><meta name="theme-color" content="#171a22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="音芙場控"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><aside><h1>音芙場控</h1><p class="muted">課程與活動音控 · 網頁版 0.5.0</p><nav id="pages"></nav><button id="addPage">＋ 新增活動頁面</button></aside><main><header><button id="pageMenu" class="mobile">☰ 分類</button><h2 id="pageTitle"></h2><button id="paste" disabled>貼上曲目</button><button id="exportPage">匯出本頁 ZIP</button><button id="importPack">匯入歌單 ZIP</button><button id="settings">⚙ 設定</button><button id="import" class="primary">＋ 匯入音樂</button><input type="file" id="files" accept="audio/*,.mp3,.m4a,.wav,.flac,.ogg" multiple hidden><input type="file" id="packFile" accept=".zip,application/zip,.json,application/json" hidden></header><section id="board" aria-label="音樂格子"></section><p id="empty" class="empty">按「匯入音樂」從裝置或已連接的雲端空間選歌；選取後會保存本機副本。<br>也可匯入另一台裝置匯出的歌單 ZIP。</p><footer id="player"><div class="now"><strong id="now">準備播放</strong><span id="remaining">剩餘 00:00</span></div><label class="seek"><span class="sr">播放進度</span><input id="seek" type="range" min="0" max="1" step=".01" value="0" disabled></label><div class="controls"><button id="pause" aria-label="暫停或繼續">▶ <span>繼續</span></button><button id="stop" class="danger">■ <span>停止</span></button><button id="loop" aria-pressed="false">↻ <span>循環</span></button><button id="talk" aria-pressed="false">🎙 <span>講話</span></button><button id="more" class="landscape-only" aria-label="調整進度與音量">☷</button></div><label class="volume">音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".8"><span id="volumeValue">80%</span></label></footer></main></div>
<dialog id="pageEditor"><form id="pageEditForm"><h2 id="pageEditTitle">修改活動頁面名稱</h2><label>頁面名稱<input id="pageEditName" required maxlength="100"></label><p id="pageEditError" class="error"></p><div class="actions"><button type="button" data-close="pageEditor">取消</button><button type="submit" class="primary">儲存</button></div></form></dialog>
<div id="toast" role="status"></div><menu id="context" hidden></menu>
<dialog id="editor"><form id="editForm"><h2>曲目與格子設定</h2><label>名稱（Enter 換行）<textarea id="name" rows="3" required></textarea></label><div class="row"><label>文字大小 <input id="font" type="number" min="12" max="48"></label><label>對齊<select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label></div><div class="row"><label>寬度 <input id="width" type="number" min="140" max="600"></label><label>高度 <input id="height" type="number" min="120" max="400"></label></div><div class="row"><button type="button" id="backgroundColor">格子 256 色票</button><button type="button" id="foregroundColor">文字 256 色票</button><button type="button" id="autoColor">自動文字色</button></div><div id="preview" class="preview"></div><div class="row"><button type="button" id="cueShortcut">設定曲目快捷鍵</button><button type="button" id="clearCueShortcut">清除快捷鍵</button></div><small>複製會保留格子與剪輯設定；貼上時清空快捷鍵，避免衝突。</small><p class="error" id="editError"></p><div class="actions"><button type="button" data-close="editor">取消</button><button type="submit" class="primary">儲存</button></div></form></dialog>
<dialog id="palette"><h2>固定 256 色票</h2><div id="swatches"></div><p id="swatchLabel"></p><div class="actions"><button data-close="palette">完成</button></div></dialog>
<dialog id="trim"><h2>波形剪輯與循環</h2><strong id="trimName"></strong><label class="check"><input id="trimLoop" type="checkbox">此曲目循環播放</label><p id="waveStatus" class="muted"></p><canvas id="wave" height="220" aria-label="點擊波形定位游標"></canvas><div class="row"><label>縮放 <input id="zoom" type="range" min="0" max="12" step=".1" value="0"></label><label>平移 <input id="pan" type="range" min="0" max="1" step=".0001" value="0"></label></div><div class="row"><label>游標（秒）<input id="cursor" type="number" step=".001" min="0"></label><button id="setStart">設為起點</button><button id="setEnd">設為終點</button></div><div class="row"><label>起點（秒）<input id="trimStart" type="number" step=".001" min="0"></label><label>終點（秒）<input id="trimEnd" type="number" step=".001" min="0"></label></div><div class="row"><button id="previewTrim">從游標試聽</button><button id="previewStart">從起點試聽</button><button id="resetTrim">恢復整首</button></div><small>以播放區間剪輯，不改原檔。波峰不是自動拍點辨識；此版不保證無縫循環。</small><p id="trimError" class="error"></p><div class="actions"><button data-close="trim">取消</button><button id="saveTrim" class="primary">儲存區間</button></div></dialog>
<dialog id="global"><h2>全局設定</h2><div class="row"><label>預設寬度 <input id="defaultWidth" type="number" min="140" max="600"></label><label>預設高度 <input id="defaultHeight" type="number" min="120" max="400"></label></div><label class="check"><input id="applyAll" type="checkbox">套用到所有既有格子</label><h3>播放控制快捷鍵</h3><div id="controlKeys"></div><p class="muted">鍵盤快捷鍵僅在 App 前景、未編輯文字時生效。Android 需外接鍵盤。</p><p id="globalError" class="error"></p><div class="actions"><button data-close="global">取消</button><button id="saveGlobal" class="primary">儲存設定</button></div></dialog>
<dialog id="sliders"><h2>進度與音量</h2><label>播放進度 <input id="smallSeek" type="range" min="0" max="1" step=".01" value="0"></label><label>音量 <input id="smallVolume" type="range" min="0" max="1" step=".01" value=".8"></label><div class="actions"><button data-close="sliders">完成</button></div></dialog>
<dialog id="categories"><h2>活動頁面</h2><p class="muted">拖曳三條線排序，點「⋯」修改名稱。</p><div id="pageOptions"></div><div class="actions"><button data-close="categories">完成</button></div></dialog>
<script type="module" src="app.mjs"></script><script type="module" src="pwa.mjs"></script></body></html>
